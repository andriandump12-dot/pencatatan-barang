<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pencatatan Barang</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f8;
    color: #1f2937;
}

.header {
    background: #111827;
    color: white;
    padding: 20px;
}

.header h1 {
    font-size: 22px;
}

.header p {
    margin-top: 5px;
    color: #9ca3af;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 18px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.card small {
    color: #6b7280;
}

.card h2 {
    margin-top: 8px;
}

.form {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.form h2 {
    margin-bottom: 15px;
}

input, select {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
}

button {
    border: none;
    padding: 11px 15px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.btn-primary {
    background: #2563eb;
    color: white;
    width: 100%;
}

.btn-danger {
    background: #ef4444;
    color: white;
    padding: 7px 10px;
}

.search {
    margin-bottom: 15px;
}

.table-container {
    background: white;
    border-radius: 12px;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 13px;
    text-align: left;
    border-bottom: 1px solid #e5e7eb;
}

th {
    background: #f9fafb;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #6b7280;
}

@media (max-width: 600px) {
    .dashboard {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 15px;
    }

    th, td {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>📦 Pencatatan Barang</h1>
    <p>Dashboard stok barang sederhana</p>
</div>

<div class="container">

    <div class="dashboard">

        <div class="card">
            <small>Total Jenis Barang</small>
            <h2 id="totalJenis">0</h2>
        </div>

        <div class="card">
            <small>Total Stok</small>
            <h2 id="totalStok">0</h2>
        </div>

        <div class="card">
            <small>Stok Menipis</small>
            <h2 id="stokMenipis">0</h2>
        </div>

    </div>

    <div class="form">

        <h2>➕ Tambah Barang</h2>

        <input
            type="text"
            id="nama"
            placeholder="Nama barang">

        <input
            type="text"
            id="kode"
            placeholder="Kode barang">

        <input
            type="number"
            id="stok"
            placeholder="Jumlah stok">

        <button
            class="btn-primary"
            onclick="tambahBarang()">
            Tambahkan Barang
        </button>

    </div>

    <input
        class="search"
        type="text"
        id="search"
        placeholder="🔎 Cari barang..."
        oninput="tampilkanBarang()">

    <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>Kode</th>
                    <th>Barang</th>
                    <th>Stok</th>
                    <th>Aksi</th>
                </tr>
            </thead>

            <tbody id="daftarBarang"></tbody>

        </table>

        <div
            id="kosong"
            class="empty">
            Belum ada barang.
        </div>

    </div>

</div>

<script>

let barang = JSON.parse(
    localStorage.getItem("barang")
) || [];

function simpanData() {

    localStorage.setItem(
        "barang",
        JSON.stringify(barang)
    );

}

function tambahBarang() {

    const nama =
        document.getElementById("nama").value.trim();

    const kode =
        document.getElementById("kode").value.trim();

    const stok =
        Number(document.getElementById("stok").value);

    if (!nama || !kode || stok < 0) {

        alert("Lengkapi data barang terlebih dahulu.");

        return;
    }

    barang.push({
        nama: nama,
        kode: kode,
        stok: stok
    });

    simpanData();

    document.getElementById("nama").value = "";
    document.getElementById("kode").value = "";
    document.getElementById("stok").value = "";

    tampilkanBarang();

}

function hapusBarang(index) {

    if (
        confirm("Yakin ingin menghapus barang ini?")
    ) {

        barang.splice(index, 1);

        simpanData();

        tampilkanBarang();

    }

}

function tampilkanBarang() {

    const tbody =
        document.getElementById("daftarBarang");

    const kosong =
        document.getElementById("kosong");

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();

    tbody.innerHTML = "";

    let hasil = barang.filter(item =>
        item.nama.toLowerCase().includes(search) ||
        item.kode.toLowerCase().includes(search)
    );

    if (hasil.length === 0) {

        kosong.style.display = "block";

    } else {

        kosong.style.display = "none";

        hasil.forEach((item) => {

            const index =
                barang.indexOf(item);

            const row =
                document.createElement("tr");

            row.innerHTML = `
                <td>${item.kode}</td>

                <td>${item.nama}</td>

                <td>${item.stok}</td>

                <td>
                    <button
                        class="btn-danger"
                        onclick="hapusBarang(${index})">
                        Hapus
                    </button>
                </td>
            `;

            tbody.appendChild(row);

        });

    }

    updateDashboard();

}

function updateDashboard() {

    document.getElementById("totalJenis")
        .textContent = barang.length;

    const total =
        barang.reduce(
            (sum, item) => sum + Number(item.stok),
            0
        );

    document.getElementById("totalStok")
        .textContent = total;

    const menipis =
        barang.filter(item =>
            Number(item.stok) <= 5
        ).length;

    document.getElementById("stokMenipis")
        .textContent = menipis;

}

tampilkanBarang();

</script>

</body>
</html>
